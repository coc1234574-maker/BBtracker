<style>
  :root{
    --bg:#FCF8F9;
    --surface:#FFFFFF;
    --border:#F5CFD7;
    --border-strong:#BE8DB5;
    --ink:#291D2B;
    --ink-muted:#584B5A;
    --accent:#794B82;
    --accent-dark:#523358;
    --accent-contrast:#FFFFFF;
    --done:#A45696;
    --done-bg:#F2D7E8;
    --danger:#B23A55;
    --danger-bg:#F7DFE3;
    --pastel-blush:#FAE7EB;
    --pastel-orchid:#F2D7E8;
    --pastel-mint-pale:#ECF8F7;
    --pastel-mauve:#B58EBC;
    --pastel-mint:#D1EDEA;
    --pastel-lilac:#D8BBD3;
    --warn:#C9793E;
    --warn-bg:#FBEADF;
    --radius:12px;
    --radius-sm:8px;
    --shadow:0 2px 10px rgba(41,29,43,0.10);
    --shadow-lift:0 8px 28px rgba(41,29,43,0.20);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:calc(90px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3{
    font-family:'Fraunces',Georgia,serif;
    font-weight:600;
    margin:0;
    letter-spacing:-0.01em;
  }
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    background:none;
  }
  input,select{
    font-family:inherit;
    font-size:15px;
  }
  ::-webkit-scrollbar{width:0;height:0;}

  /* ---------- Header ---------- */
  .topbar{
    background:var(--accent);
    color:var(--accent-contrast);
    padding:calc(16px + env(safe-area-inset-top)) 16px 14px;
    position:sticky;
    top:0;
    z-index:20;
  }
  .topbar-title{
    font-size:20px;
    color:#fff;
    margin-bottom:12px;
  }
  .account-row{
    display:flex;
    gap:8px;
    align-items:center;
  }
  .account-select{
    flex:1;
    background:rgba(255,255,255,0.14);
    color:#fff;
    border:1px solid rgba(255,255,255,0.35);
    border-radius:var(--radius-sm);
    padding:9px 10px;
    font-size:14px;

<body>
<div id="app"></div>

<script>
/* ============================= STATE ============================= */
let accounts = [];
let events = [];
let activeUid = null;
let progress = {};
let currentTab = 'all';
let editingUid = null; // account currently in edit mode within manage sheet
let editingEventId = null; // activity currently in edit mode within event sheet
let modal = null; // null | 'accounts' | 'event' | 'dashboard'

/* ============================= STORAGE HELPERS ============================= */
function storeGet(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    if(raw === null || raw === undefined) return fallback;
    return JSON.parse(raw);
  }catch(e){ console.error('storage get failed', key, e); return fallback; }
}
function storeSet(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }
  catch(e){ console.error('storage set failed', key, e); alert('Could not save data — your browser storage may be full or disabled for this page.'); }
}
function storeDelete(key){
  try{ localStorage.removeItem(key); }catch(e){}
}

/* ============================= DATE / RESET LOGIC ============================= */
// "logical day" boundary at 2AM UTC
function logicalDayKey(date){
  const shifted = new Date(date.getTime() - 2*60*60*1000);
  return shifted.toISOString().slice(0,10);
}
// "logical week" boundary Monday 2AM UTC
function logicalWeekKey(date){
  const shifted = new Date(date.getTime() - 2*60*60*1000);
  const day = shifted.getUTCDay(); // 0 Sun .. 6 Sat
  const diffToMonday = (day === 0 ? -6 : 1 - day);
  const monday = new Date(shifted);
  monday.setUTCDate(shifted.getUTCDate() + diffToMonday);
  return monday.toISOString().slice(0,10);
}
function computePeriodKey(ev){
  const now = new Date();
  if(ev.tracking === 'daily') return 'd:'+logicalDayKey(now);
  // once
  if(ev.eventType === 'weekly') return 'w:'+logicalWeekKey(now);
  return 'once';
}
function isExpiredSpecial(ev, now){
  if(ev.eventType !== 'special' || !ev.dateTo) return false;
  const currentLogicalDay = logicalDayKey(now);
  const dateTo = new Date(ev.dateTo+'T00:00:00Z');
  const cutoff = new Date(dateTo.getTime() + 24*60*60*1000);
  const cutoffDayStr = cutoff.toISOString().slice(0,10);
  return currentLogicalDay >= cutoffDayStr;
}
function daysLeft(dateToStr){
  const now = new Date();
  const dateTo = new Date(dateToStr+'T23:59:59Z');
  const diff = dateTo.getTime() - now.getTime();
  return Math.max(0, Math.ceil(diff / (24*60*60*1000)));
}

function nextDailyResetUTC(now){
  const y = now.getUTCFullYear(), m = now.getUTCMonth(), d = now.getUTCDate();
  let reset = new Date(Date.UTC(y,m,d,2,0,0));
  if(reset.getTime() <= now.getTime()) reset = new Date(reset.getTime() + 24*60*60*1000);
  return reset;
}
function nextWeeklyResetUTC(now){
  let d = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), 2, 0, 0));
  while(d.getUTCDay() !== 1 || d.getTime() <= now.getTime()){
    d = new Date(d.getTime() + 24*60*60*1000);
  }
  return d;
}
function formatDuration(ms){
  if(ms <= 0) return 'now';
  const totalMin = Math.floor(ms/60000);
  const days = Math.floor(totalMin/1440);
  const hours = Math.floor((totalMin%1440)/60);
  const mins = totalMin%60;
  if(days > 0) return days+'d '+hours+'h';
  if(hours > 0) return hours+'h '+mins+'m';
  return mins+'m';
}
// Returns { label, remainingMs, urgent } describing when this activity's current window closes
function formatUtc8Time(date){
  const shifted = new Date(date.getTime() + 8*60*60*1000);
  let h = shifted.getUTCHours();
  const m = shifted.getUTCMinutes();
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if(h === 0) h = 12;
  return h+':'+String(m).padStart(2,'0')+' '+ampm;
}
function formatUtc8Weekday(date){
  const shifted = new Date(date.getTime() + 8*60*60*1000);
  return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][shifted.getUTCDay()];
}
function eventDeadlineInfo(ev){
  const now = new Date();
  if(ev.tracking === 'daily'){
    const reset = nextDailyResetUTC(now);
    const remaining = reset - now;
    return {label: 'Resets '+formatUtc8Time(reset)+' (UTC+8) · in '+formatDuration(remaining), remainingMs: remaining, urgent: remaining <= 3*60*60*1000};
  }
  if(ev.eventType === 'weekly'){
    const reset = nextWeeklyResetUTC(now);
    const remaining = reset - now;
    return {label: 'Resets '+formatUtc8Weekday(reset)+' '+formatUtc8Time(reset)+' (UTC+8) · in '+formatDuration(remaining), remainingMs: remaining, urgent: remaining <= 24*60*60*1000};
  }
  const dl = daysLeft(ev.dateTo);
  return {label: dl<=0 ? 'Last day' : dl+' day'+(dl===1?'':'s')+' left', remainingMs: dl*24*60*60*1000, urgent: dl<=1};
}

// On Demand activities: checking them starts a cooldown timer; they are never part of progress.
function getOnDemandState(ev, entry){
  const cooldownMs = (ev.cooldownHours || 8) * 60 * 60 * 1000;
  if(entry && entry.activatedAt){
    const elapsed = Date.now() - entry.activatedAt;
    if(elapsed < cooldownMs){
      return {active: true, remainingMs: cooldownMs - elapsed};
    }
  }
  return {active: false, remainingMs: 0};
}

// Unified per-card display state for both normal (Daily/Once) and On Demand activities.
function getEventDisplayState(ev, progressObj){
  if(ev.eventType === 'ondemand'){
    const entry = progressObj[ev.id];
    const state = getOnDemandState(ev, entry);
    return {
      isDone: state.active,
      isUrgent: false,
      trackingBadge: (ev.cooldownHours||8)+'h cooldown',
      statusBadge: state.active ? ('Active · '+formatDuration(state.remainingMs)+' left') : 'Ready'
    };
  }
  const key = computePeriodKey(ev);
  const cur = progressObj[ev.id];
  const isDone = !!(cur && cur.periodKey === key && cur.done);
  const deadline = eventDeadlineInfo(ev);
  const isUrgent = !isDone && deadline.urgent;
  return {
    isDone,
    isUrgent,
    trackingBadge: ev.tracking==='daily' ? 'Daily' : 'Once',
    statusBadge: (isUrgent?'⏳ ':'') + deadline.label
  };
}

async function cleanupExpiredSpecialEvents(){
  const now = new Date();
  const expired = events.filter(e => isExpiredSpecial(e, now));
  if(!expired.length) return;
  const expiredIds = new Set(expired.map(e=>e.id));
  events = events.filter(e => !expiredIds.has(e.id));
  await storeSet('events', events);
  for(const acc of accounts){
    const p = await storeGet('progress:'+acc.uid, {});
    let changed = false;
    for(const id of expiredIds){ if(p[id] !== undefined){ delete p[id]; changed = true; } }
    if(changed) await storeSet('progress:'+acc.uid, p);
  }
  if(activeUid){ progress = await storeGet('progress:'+activeUid, {}); }
}

function genId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ============================= INIT ============================= */
async function init(){
  accounts = await storeGet('accounts', []);
  events = await storeGet('events', []);
  activeUid = await storeGet('activeAccount', null);
  await cleanupExpiredSpecialEvents();
  if(activeUid && !accounts.find(a=>a.uid===activeUid)) activeUid = null;
  if(!activeUid && accounts.length) activeUid = accounts[0].uid;
  if(activeUid){
    progress = await storeGet('progress:'+activeUid, {});
    await storeSet('activeAccount', activeUid);
  }
  render();
  maybeShowInstallTip();
}

/* ============================= ACTIONS: ACCOUNTS ============================= */
async function switchAccount(uid){
  activeUid = uid || null;
  await storeSet('activeAccount', activeUid);
  progress = activeUid ? await storeGet('progress:'+activeUid, {}) : {};
  render();
}

function parseTagsInput(raw){
  return (raw||'').split(',').map(t=>t.trim()).filter(t=>t.length>0);
}

async function addAccountManual(){
  const username = document.getElementById('new-acc-username').value.trim();
  const email = document.getElementById('new-acc-email').value.trim();
  const uid = document.getElementById('new-acc-uid').value.trim();
  const castleLevel = parseInt(document.getElementById('new-acc-castle').value, 10) || 1;
  const tags = parseTagsInput(document.getElementById('new-acc-tags').value);
  if(!username || !uid){ alert('Username and UID are required.'); return; }
  if(accounts.find(a=>a.uid===uid)){ alert('An account with this UID already exists.'); return; }
  accounts.push({username, email, uid, castleLevel, tags});
  await storeSet('accounts', accounts);
  await storeSet('progress:'+uid, {});
  document.getElementById('new-acc-username').value = '';

let xlsxLoadPromise = null;
function loadXlsxLibrary(){
  if(window.XLSX) return Promise.resolve();
  if(xlsxLoadPromise) return xlsxLoadPromise;
  xlsxLoadPromise = new Promise((resolve, reject)=>{
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    script.crossOrigin = 'anonymous';
    script.onload = () => window.XLSX ? resolve() : reject(new Error('Library loaded but did not initialize.'));
    script.onerror = () => reject(new Error('Could not load the Excel library. Check your internet connection.'));
    document.head.appendChild(script);
  });
  return xlsxLoadPromise;
}

async function importRows(rows){
  // rows: array of {username, email, uid, castleLevel, tags} (already trimmed strings)
  let added = 0, updated = 0;
  const skippedDetails = [];
  for(let i=0; i<rows.length; i++){
    const row = rows[i];
    const rowLabel = 'Row '+(i+2)+(row.username ? ' ("'+row.username+'")' : '');
    const username = (row.username||'').trim();
    const email = (row.email||'').trim();
    const uid = (row.uid||'').trim();
    const castleLevel = parseInt(row.castleLevel, 10) || 1;
    const tags = (row.tags||'').toString().split(';').map(t=>t.trim()).filter(t=>t.length>0);
    if(!username){ skippedDetails.push(rowLabel+': missing Username'); continue; }
    if(!uid){ skippedDetails.push(rowLabel+': missing UID'); continue; }
    const existing = accounts.find(a=>a.uid===uid);
    if(existing){ existing.username = username; existing.email = email || existing.email; existing.castleLevel = castleLevel; existing.tags = tags; updated++; }
    else{ accounts.push({username, email, uid, castleLevel, tags}); await storeSet('progress:'+uid, {}); added++; }
  }
  await storeSet('accounts', accounts);
  if(!activeUid && accounts.length) await switchAccount(accounts[0].uid); else render();
  let msg = 'Import complete — '+added+' added, '+updated+' updated';
  if(skippedDetails.length){
    msg += ', '+skippedDetails.length+' skipped:\n\n' + skippedDetails.slice(0,20).join('\n');
    if(skippedDetails.length > 20) msg += '\n…and '+(skippedDetails.length-20)+' more.';
  } else {
    msg += '.';
  }
  alert(msg);
}

function handleCsvUpload(file, input){

    const text = e.target.result;
    const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length);
    if(!lines.length){ alert('The file appears to be empty.'); return; }
    let start = 0;
    if(/username/i.test(lines[0]) && /uid/i.test(lines[0])) start = 1;
    const rows = [];
    for(let i=start;i<lines.length;i++){
      const parts = lines[i].split(',').map(p=>p.trim().replace(/^"|"$/g,''));

function isEventApplicable(ev, account){
  const castleLevel = account ? (account.castleLevel || 1) : 1;
  if(ev.minCastleLevel !== null && ev.minCastleLevel !== undefined && ev.minCastleLevel !== ''){
    if(castleLevel < ev.minCastleLevel) return false;
  }
  if(ev.requiredTag){
    const tags = (account && Array.isArray(account.tags)) ? account.tags : [];
    const target = ev.requiredTag.trim().toLowerCase();
    const hasTag = tags.some(t => (t||'').trim().toLowerCase() === target);
    if(!hasTag) return false;
  }
  return true;
}

function computeStats(progressObj, account){
  const byType = {daily:{total:0,done:0}, weekly:{total:0,done:0}, special:{total:0,done:0}};
  const byTracking = {daily:{total:0,done:0}, once:{total:0,done:0}};
  let totalCount = 0, totalDone = 0;
  for(const ev of events){
    if(ev.eventType === 'ondemand') continue; // on-demand activities are never part of progress
    if(!isEventApplicable(ev, account)) continue;
    totalCount++;
    byType[ev.eventType].total++;
    byTracking[ev.tracking].total++;
    const key = computePeriodKey(ev);
    const cur = progressObj[ev.id];
    const isDone = !!(cur && cur.periodKey === key && cur.done);
    if(isDone){
      totalDone++;
      byType[ev.eventType].done++;
      byTracking[ev.tracking].done++;
    }
  }
  const pct = totalCount ? Math.round((totalDone/totalCount)*100) : 0;
  return {totalCount, totalDone, pct, byType, byTracking};
}

/* ---- Bulk import activities from CSV / XLSX ---- */
/* Expected columns: Name, Type (Daily/Weekly/Special Event), Tracking (Daily/Once), Date From, Date To */
function normalizeEventType(raw){
  const s = (raw||'').toString().trim().toLowerCase();
  if(s.startsWith('daily')) return 'daily';
  if(s.startsWith('weekly')) return 'weekly';
  if(s.startsWith('special')) return 'special';
  if(s.startsWith('on demand') || s.startsWith('ondemand') || s.startsWith('on-demand')) return 'ondemand';
  return null;
}
function normalizeTracking(raw){
  const s = (raw||'').toString().trim().toLowerCase();
  if(s.startsWith('daily')) return 'daily';
  if(s.startsWith('once')) return 'once';
  return null;
}
function normalizeDateStr(raw){
  if(raw === null || raw === undefined || raw === '') return null;
  const s = raw.toString().trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m) return `${m[3]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;
  const d = new Date(s);
  if(!isNaN(d.getTime())) return d.toISOString().slice(0,10);
  return null;
}

async function importActivityRows(rows){
  let added = 0;
  const skippedDetails = [];

  for(let i=0; i<rows.length; i++){
    const row = rows[i];
    const rowLabel = 'Row '+(i+2)+(row.name ? ' ("'+row.name+'")' : ''); // +2: header is row 1

    const name = (row.name||'').toString().trim();
    const eventType = normalizeEventType(row.type);

    if(!name){ skippedDetails.push(rowLabel+': missing Name'); continue; }
    if(!eventType){ skippedDetails.push(rowLabel+': Type must be Daily, Weekly, or Special Event'); continue; }
    if(isDuplicateEvent(name, eventType)){ skippedDetails.push(rowLabel+': duplicate — already exists under '+typeLabel(eventType)); continue; }

    let tracking = eventType === 'daily' ? 'daily' : (eventType === 'ondemand' ? 'ondemand' : (normalizeTracking(row.tracking) || 'once'));
    let dateFrom = null, dateTo = null;
    if(eventType === 'special'){
      dateFrom = normalizeDateStr(row.dateFrom);
      dateTo = normalizeDateStr(row.dateTo);
      if(!dateFrom || !dateTo){ skippedDetails.push(rowLabel+': Special Event needs a valid Date From and Date To'); continue; }
      if(dateFrom > dateTo){ skippedDetails.push(rowLabel+': Date From must be before Date To'); continue; }
    }
    let minCastleLevel = null;
    const rawCastle = (row.minCastleLevel||'').toString().trim();
    if(rawCastle !== ''){
      const n = parseInt(rawCastle, 10);
      if(!isNaN(n) && n >= 1) minCastleLevel = n;
    }
    const requiredTag = (row.requiredTag||'').toString().trim() || null;
    const cooldownHours = eventType === 'ondemand' ? 8 : null; // imported On Demand rows default to 8h; edit afterward to change
    events.push({id: genId(), name, eventType, tracking, dateFrom, dateTo, minCastleLevel, requiredTag, cooldownHours});
    added++;
  }

  await storeSet('events', events);
  render();
  if(modal === null) modal = 'event'; // keep the sheet open/visible after import

  let msg = 'Import complete — '+added+' added';
  if(skippedDetails.length){
    msg += ', '+skippedDetails.length+' skipped:\n\n' + skippedDetails.slice(0,20).join('\n');
    if(skippedDetails.length > 20) msg += '\n…and '+(skippedDetails.length-20)+' more.';
  } else {
    msg += '.';
  }
  alert(msg);
}

async function toggleEvent(id){
  if(!activeUid) return;
  const ev = events.find(e=>e.id===id);
  if(!ev) return;

  if(ev.eventType === 'ondemand'){
    const state = getOnDemandState(ev, progress[id]);
    if(state.active){
      delete progress[id]; // tap again to cancel early
    } else {
      progress[id] = {activatedAt: Date.now()};
    }
    await storeSet('progress:'+activeUid, progress);
    render();
    return;
  }

  const key = computePeriodKey(ev);
  const cur = progress[id];
  const isDone = !!(cur && cur.periodKey === key && cur.done);
  progress[id] = {periodKey: key, done: !isDone};
  await storeSet('progress:'+activeUid, progress);
  render();
}

function copyText(text, label){
  function fallbackCopy(){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try{ document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(
      () => showCopyToast(label+' copied'),
      () => { fallbackCopy(); showCopyToast(label+' copied'); }
    );
  } else {
    fallbackCopy();
    showCopyToast(label+' copied');
  }
}

function accountDailyIndicator(acc){
  const p = (acc.uid === activeUid) ? progress : storeGet('progress:'+acc.uid, {});
  let total = 0, done = 0;
  for(const ev of events){
    if(ev.eventType === 'ondemand') continue;
    if(ev.tracking !== 'daily') continue;
    if(!isEventApplicable(ev, acc)) continue;
    total++;
    const key = computePeriodKey(ev);
    const cur = p[ev.id];
    if(cur && cur.periodKey === key && cur.done) done++;
  }
  if(total === 0) return '';
  if(done === total) return '✅ ';
  if(done > 0) return '🟡 ';
  return '⬜ ';
}

function render(){
  const app = document.getElementById('app');
  const activeAccount = accounts.find(a=>a.uid===activeUid);

  let html = '';
  html += `<div class="topbar">
    <h1 class="topbar-title">Activity Tracker</h1>
    <div class="account-row">
      <select class="account-select" onchange="switchAccount(this.value)">
        ${accounts.length ? accounts.map(a=>`<option value="${escapeHtml(a.uid)}" ${a.uid===activeUid?'selected':''}>${accountDailyIndicator(a)}${escapeHtml(a.username)} · Lvl ${a.castleLevel||1}</option>`).join('') : `<option value="">No accounts yet</option>`}
      </select>
      <button class="icon-btn" onclick="openDashboardModal()" aria-label="Dashboard" title="Dashboard">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" style="vertical-align:-2px;margin-right:4px;"><path d="M4 20V10M12 20V4M20 20v-7" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>Stats
      </button>
      <button class="icon-btn" onclick="openAccountsModal()">Accounts</button>
    </div>
  </div>`;

  if(!accounts.length){
    html += `<div class="content"><div class="empty-state">
      <h2>Add your first account</h2>
      <p>Create an account to start tracking daily, weekly, and special-event activities. Progress is saved per account, right on this device.</p>
      <button class="btn btn-primary" style="max-width:260px;margin:0 auto;" onclick="openAccountsModal()">Add account</button>
    </div></div>`;
    app.innerHTML = html + renderModal();
    return;
  }

  html += `<div class="tabs">
    ${['all','daily','weekly','special','ondemand'].map(t=>`<button class="tab ${currentTab===t?'active':''}" onclick="setTab('${t}')">${t==='all'?'All':typeLabel(t)}</button>`).join('')}
  </div>`;

  html += `<div class="content">`;

  if(activeAccount){
    html += `<div class="account-info-card">
      <div class="account-info-top">
        <div class="account-info-name">${escapeHtml(activeAccount.username)}</div>
        <div class="account-info-lvl">Castle Lvl ${activeAccount.castleLevel||1}</div>
      </div>
      <div class="account-info-row">
        <span class="account-info-label">UID</span>
        <span class="account-info-value">${escapeHtml(activeAccount.uid)}</span>
        <button class="link-btn" onclick="copyAccountField('uid')">Copy</button>
      </div>
      ${activeAccount.email ? `<div class="account-info-row">
        <span class="account-info-label">Email</span>
        <span class="account-info-value">${escapeHtml(activeAccount.email)}</span>
        <button class="link-btn" onclick="copyAccountField('email')">Copy</button>
      </div>` : ''}
    </div>`;
  }

  const filtered = events.filter(e => (currentTab==='all' || e.eventType===currentTab) && isEventApplicable(e, activeAccount));

  if(!filtered.length){
    html += `<div class="empty-state">
      <h2>${currentTab==='all' ? 'No activities yet' : 'Nothing here yet'}</h2>
      <p>Tap the + button to add a daily habit, a weekly goal, a time-boxed special event, or an on-demand activity.</p>
    </div>`;
  }else{
    const groups = currentTab === 'all'
      ? [['daily','Daily'],['weekly','Weekly'],['special','Special Events'],['ondemand','On Demand']]
      : [[currentTab, typeLabel(currentTab)]];

    for(const [type, label] of groups){
      const items = filtered.filter(e=>e.eventType===type);
      if(!items.length) continue;
      if(currentTab === 'all') html += `<div class="section-label">${label}</div>`;
      for(const ev of items){
        const state = getEventDisplayState(ev, progress);
        html += `<div class="event-card ${state.isUrgent?'urgent':''}">
          <div class="checkbox ${state.isDone?'checked':''}" onclick="toggleEvent('${ev.id}')">
            <svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div class="event-info" onclick="toggleEvent('${ev.id}')">
            <div class="event-name ${state.isDone?'checked':''}">${escapeHtml(ev.name)}</div>
            <div class="event-meta">
              <span class="badge type-${ev.eventType}">${typeLabel(ev.eventType)}</span>
              <span class="badge">${state.trackingBadge}</span>
              ${ev.minCastleLevel ? `<span class="badge">Min Lvl ${ev.minCastleLevel}</span>` : ''}
              ${ev.requiredTag ? `<span class="badge">Tag: ${escapeHtml(ev.requiredTag)}</span>` : ''}
              <span class="badge ${state.isUrgent?'urgent':''}">${state.statusBadge}</span>
            </div>
          </div>
          <div class="event-actions">
            <button class="link-btn" onclick="openEventModal('${ev.id}')">Edit</button>
            <button class="delete-x" onclick="deleteEvent('${ev.id}')">×</button>
          </div>
        </div>`;
      }
    }
  }
  html += `</div>`;
  html += `<button class="fab" onclick="openEventModal()">+</button>`;

  app.innerHTML = html + renderModal();

  if(modal === 'event'){ onEventTypeChange(); }
}

function renderModal(){
  if(modal === 'accounts') return renderAccountsModal();
  if(modal === 'event') return renderEventModal();
  if(modal === 'dashboard') return renderDashboardModal();
  return '';
}

function renderDashboardModal(){
  let inner = `<div class="sheet-header"><h3>Dashboard</h3><button class="sheet-close" onclick="closeModal()">Done</button></div>`;

  if(!accounts.length){
    inner += `<p class="hint">Add an account first to see progress here.</p>`;
    return `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="sheet-handle"></div>${inner}</div></div>`;
  }

  const activeAccount = accounts.find(a=>a.uid===activeUid);
  if(activeAccount){
    const myProgress = dashboardAllProgress[activeUid] || {};
    const stats = computeStats(myProgress, activeAccount);
    inner += `<div class="dash-hero">
      <div class="dash-hero-name">${escapeHtml(activeAccount.username)}</div>
      <div class="dash-hero-pct">${stats.totalCount ? stats.pct+'%' : '—'}</div>
      <div class="dash-hero-sub">${stats.totalCount ? stats.totalDone+' of '+stats.totalCount+' activities done' : 'No activities yet'}</div>
      ${(stats.totalCount>0 && stats.totalDone===stats.totalCount) ? `<div class="dash-complete-tag">All caught up</div>` : ''}
    </div>`;

    if(stats.totalCount){
      // Daily tracking group — one shared timeframe (today's reset window)
      const dailyStat = stats.byTracking.daily;
      if(dailyStat.total){
        const pct = Math.round((dailyStat.done/dailyStat.total)*100);
        const resetInfo = eventDeadlineInfo({tracking:'daily'});
        inner += `<div class="stat-row">
          <div class="stat-row-top"><span>Daily</span><span>${dailyStat.done}/${dailyStat.total}</span></div>
          <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
          <div class="hint" style="margin-top:5px;">Today · ${resetInfo.label}</div>
        </div>`;
      }

      // Once tracking group — timeframes vary per item (weekly window or special date range), so itemize
      const onceStat = stats.byTracking.once;
      if(onceStat.total){
        const pct = Math.round((onceStat.done/onceStat.total)*100);
        inner += `<div class="stat-row">
          <div class="stat-row-top"><span>Once</span><span>${onceStat.done}/${onceStat.total}</span></div>
          <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
          <div class="hint" style="margin-top:5px;">Weekly goals and special events — each tracked once per window</div>
        </div>`;

        const onceEvents = events.filter(e=>e.tracking==='once' && isEventApplicable(e, activeAccount)).map(ev=>{
          const key = computePeriodKey(ev);
          const cur = myProgress[ev.id];
          const isDone = !!(cur && cur.periodKey === key && cur.done);
          const deadline = eventDeadlineInfo(ev);
          return {ev, isDone, deadline};
        });
        onceEvents.sort((a,b)=>{
          if(a.isDone !== b.isDone) return a.isDone ? 1 : -1;
          return a.deadline.remainingMs - b.deadline.remainingMs;
        });
        inner += onceEvents.map(({ev,isDone,deadline})=>{
          const isUrgent = !isDone && deadline.urgent;
          return `<div class="once-item ${isUrgent?'urgent':''} ${isDone?'done':''}">
            <span class="once-item-dot ${isDone?'done':''}"></span>
            <span class="once-item-name ${isDone?'done':''}">${escapeHtml(ev.name)}</span>
            <span class="once-item-frame ${isUrgent?'urgent':''}">${isUrgent?'⏳ ':''}${isDone?'Done':deadline.label}</span>
          </div>`;
        }).join('');
      }
    }
    inner += `<div class="divider"></div>`;
  }

  inner += `<div class="section-label" style="margin-top:0;">All accounts</div>`;
  const rows = accounts.map(a => ({acc:a, stats: computeStats(dashboardAllProgress[a.uid] || {}, a)}));
  rows.sort((a,b)=> b.stats.pct - a.stats.pct);
  for(const {acc, stats} of rows){
    const isYou = acc.uid === activeUid;
    const full = stats.totalCount>0 && stats.totalDone===stats.totalCount;
    inner += `<div class="account-stat-row">
      <div class="account-stat-top">
        <div class="account-stat-name">${escapeHtml(acc.username)}${isYou?'<span class="you-tag">ACTIVE</span>':''}</div>
        <div class="account-stat-pct ${full?'full':''}">${stats.totalCount ? stats.pct+'%' : '—'}</div>
      </div>
      <div class="bar"><div class="bar-fill" style="width:${stats.totalCount?stats.pct:0}%"></div></div>
    </div>`;
  }

  return `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="sheet-handle"></div>${inner}</div></div>`;
}

function renderAccountsModal(){
  let inner = `<div class="sheet-header"><h3>Accounts</h3><button class="sheet-close" onclick="closeModal()">Done</button></div>`;

  inner += `<div class="section-label" style="margin-top:0;">Your accounts</div>`;
  if(!accounts.length){
    inner += `<p class="hint">No accounts yet — add one below.</p>`;
  }else{
    for(const acc of accounts){
      if(editingUid === acc.uid){
        inner += `<div class="account-item">
          <div class="field"><label>Username</label><input type="text" id="edit-acc-username" value="${escapeHtml(acc.username)}"></div>
          <div class="field"><label>Email</label><input type="email" id="edit-acc-email" value="${escapeHtml(acc.email||'')}"></div>
          <div class="field-row">
            <div class="field"><label>UID</label><input type="text" id="edit-acc-uid" value="${escapeHtml(acc.uid)}"></div>
            <div class="field"><label>Castle Level</label><input type="number" id="edit-acc-castle" min="1" value="${acc.castleLevel||1}"></div>
          </div>
          <div class="field"><label>Tags</label><input type="text" id="edit-acc-tags" value="${escapeHtml((acc.tags||[]).join(', '))}" placeholder="comma-separated, e.g. R5, Whale"></div>
          <div class="btn-row">
            <button class="btn btn-secondary" onclick="cancelEditAccount()">Cancel</button>
            <button class="btn btn-primary" onclick="saveEditAccount('${escapeHtml(acc.uid)}')">Save</button>
          </div>
        </div>`;
      }else{
        inner += `<div class="account-item">
          <div class="account-item-top">
            <div>
              <div class="account-name">${escapeHtml(acc.username)} ${acc.uid===activeUid?'· <span style="color:var(--accent-dark);">active</span>':''}</div>
              <div class="account-sub">${escapeHtml(acc.email||'no email')} · UID ${escapeHtml(acc.uid)} · Castle Lvl ${acc.castleLevel||1}</div>
              ${(acc.tags && acc.tags.length) ? `<div class="account-sub">Tags: ${escapeHtml(acc.tags.join(', '))}</div>` : ''}
            </div>
            <div class="account-actions">
              <button class="link-btn" onclick="startEditAccount('${escapeHtml(acc.uid)}')">Edit</button>
              <button class="link-btn danger" onclick="deleteAccount('${escapeHtml(acc.uid)}')">Delete</button>
            </div>
          </div>
        </div>`;
      }
    }
  }

  inner += `<div class="divider"></div>`;
  inner += `<div class="section-label" style="margin-top:0;">Add account manually</div>
    <div class="field"><label>Username</label><input type="text" id="new-acc-username" placeholder="e.g. jsmith"></div>
    <div class="field-row">
      <div class="field"><label>Email</label><input type="email" id="new-acc-email" placeholder="optional"></div>
      <div class="field"><label>UID</label><input type="text" id="new-acc-uid" placeholder="unique ID"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Castle Level</label><input type="number" id="new-acc-castle" min="1" value="1"></div>
      <div class="field"><label>Tags</label><input type="text" id="new-acc-tags" placeholder="e.g. R5, Whale"></div>
    </div>
    <button class="btn btn-primary" onclick="addAccountManual()">Add account</button>`;

  inner += `<div class="divider"></div>`;
  inner += `<div class="section-label" style="margin-top:0;">Or upload a file</div>
    <div class="upload-box">
      <label class="upload-label" for="csv-file">Choose a CSV or Excel file to import</label>
      <input type="file" id="csv-file" accept=".csv,text/csv,.xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" onchange="handleFileUpload(this)">
      <div class="csv-format">Columns: Username, Email, UID, Castle Level, Tags</div>
      <div class="hint" style="margin-top:6px;">In the Tags column, separate multiple tags with a semicolon, e.g. R5;Whale</div>
    </div>`;

  inner += `<div class="divider"></div>`;
  inner += `<div class="section-label" style="margin-top:0;color:var(--danger);">Danger zone</div>
    <p class="hint" style="margin-bottom:10px;">Permanently deletes every account, every activity, and all saved progress on this device. This cannot be undone.</p>
    <button class="btn btn-danger-outline" onclick="resetAllData()">Delete all data</button>`;

  return `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="sheet-handle"></div>${inner}</div></div>`;
}

function renderEventModal(){
  const ev = editingEventId ? events.find(e=>e.id===editingEventId) : null;
  const isEdit = !!ev;

  let inner = `<div class="sheet-header"><h3>${isEdit?'Edit activity':'New activity'}</h3><button class="sheet-close" onclick="closeModal()">Cancel</button></div>`;
  inner += `
    <div class="field"><label>Event name</label><input type="text" id="ev-name" placeholder="e.g. Morning stretch" value="${isEdit?escapeHtml(ev.name):''}"></div>
    <div class="field-row">
      <div class="field">
        <label>Event type</label>
        <select id="ev-type" onchange="onEventTypeChange()">
          <option value="daily" ${isEdit && ev.eventType==='daily'?'selected':''}>Daily</option>
          <option value="weekly" ${isEdit && ev.eventType==='weekly'?'selected':''}>Weekly</option>
          <option value="special" ${isEdit && ev.eventType==='special'?'selected':''}>Special Event</option>
          <option value="ondemand" ${isEdit && ev.eventType==='ondemand'?'selected':''}>On Demand</option>
        </select>
      </div>
      <div class="field">
        <label>Tracking</label>
        <select id="ev-tracking">
          <option value="daily" ${isEdit && ev.tracking==='daily'?'selected':''}>Daily</option>
          <option value="once" ${!isEdit || ev.tracking==='once'?'selected':''}>Once</option>
        </select>
      </div>
    </div>
    <div class="field" id="date-range-field">
      <label>Event duration</label>
      <div class="field-row">
        <input type="date" id="ev-date-from" disabled value="${isEdit && ev.dateFrom ? ev.dateFrom : ''}">
        <input type="date" id="ev-date-to" disabled value="${isEdit && ev.dateTo ? ev.dateTo : ''}">
      </div>
      <div class="hint">Only used for Special Events. The event is removed automatically the day after it ends.</div>
    </div>
    <div class="field" id="cooldown-field">
      <label>Cooldown (hours)</label>
      <input type="number" id="ev-cooldown-hours" min="1" disabled value="${isEdit && ev.cooldownHours ? ev.cooldownHours : 8}">
      <div class="hint">Only used for On Demand activities. Checking it off starts this countdown; it becomes available again once it expires. Not counted toward progress.</div>
    </div>
    <div class="field">
      <label>Minimum Castle Level</label>
      <input type="number" id="ev-min-castle" min="1" placeholder="Leave blank if anyone can do it" value="${isEdit && ev.minCastleLevel ? ev.minCastleLevel : ''}">
      <div class="hint">Accounts below this level won't see this activity, and it won't count toward their progress.</div>
    </div>
    <div class="field">
      <label>Required Tag</label>
      <input type="text" id="ev-required-tag" placeholder="Leave blank if anyone can do it" value="${isEdit && ev.requiredTag ? escapeHtml(ev.requiredTag) : ''}">
      <div class="hint">Only accounts with this exact tag (see Accounts) will see this activity. Independent of Castle Level — both can be set together.</div>
    </div>
    <button class="btn btn-primary" onclick="submitEventForm()">${isEdit?'Save changes':'Add activity'}</button>
  `;

  if(!isEdit){
    inner += `
    <div class="divider"></div>
    <div class="section-label" style="margin-top:0;">Or import several from a file</div>
    <div class="upload-box">
      <label class="upload-label" for="activity-file">Choose a CSV or Excel file to import</label>
      <input type="file" id="activity-file" accept=".csv,text/csv,.xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" onchange="handleActivityFileUpload(this)">
      <div class="csv-format">Columns: Name, Type (Daily / Weekly / Special Event / On Demand), Tracking (Daily / Once), Date From, Date To, Min Castle Level, Required Tag</div>
      <div class="hint" style="margin-top:6px;">Date From/To are only needed for Special Events. Leave Min Castle Level and/or Required Tag blank if anyone can do the activity. Imported On Demand rows default to an 8h cooldown — edit afterward to change it.</div>
    </div>
    <div class="divider"></div>
    <div class="section-label" style="margin-top:0;color:var(--danger);">Danger zone</div>
    <p class="hint" style="margin-bottom:10px;">Permanently deletes every activity, for every account, and clears related progress. This cannot be undone.</p>
    <button class="btn btn-danger-outline" onclick="deleteAllActivities()">Delete all activities</button>
    `;
  }

  return `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="sheet-handle"></div>${inner}</div></div>`;
}

window.addEventListener('error', function(e){
  console.error('Unhandled error:', e.error || e.message);
});
window.addEventListener('unhandledrejection', function(e){
  console.error('Unhandled promise rejection:', e.reason);
});

function isStandaloneDisplay(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function isIosSafari(){
  const ua = window.navigator.userAgent;
  const isIos = /iPad|iPhone|iPod/.test(ua) || (ua.includes('Macintosh') && 'ontouchend' in document);
  const isSafari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS/.test(ua);
  return isIos && isSafari;
}
function dismissInstallTip(){
  storeSet('installTipDismissed', true);
  const el = document.getElementById('install-tip');
  if(el) el.remove();
}
function maybeShowInstallTip(){
  if(isStandaloneDisplay()) return;
  if(!isIosSafari()) return;
  if(storeGet('installTipDismissed', false)) return;
  const div = document.createElement('div');
  div.className = 'install-tip';
  div.id = 'install-tip';
  div.innerHTML = `<span>Install this as an app: tap <b>Share</b>, then <b>Add to Home Screen</b>.</span><button class="tip-close" onclick="dismissInstallTip()">×</button>`;
  document.body.appendChild(div);
}

init();
</script>
